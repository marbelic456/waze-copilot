
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waze Co-Pilot</title>
<style>
body {
  margin: 0;
  padding: 22px;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 480px;
  margin: 20px auto;
  background: #1d2935;
  padding: 22px;
  border-radius: 18px;
}
h1 { color: #45d483; }
p { color: #bdc9d4; }
label { display:block; margin-top:18px; }
input, select {
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin-top:8px;
  border-radius:9px;
  border:1px solid #526273;
  background:#101820;
  color:white;
  font-size:16px;
}
button {
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#24a85a;
  color:white;
  font-size:16px;
  font-weight:bold;
}
.note {
  font-size:13px;
  line-height:1.6;
  margin-top:20px;
}
</style>
</head>
<body>
<div class="container">
  <h1>🧭 Waze Co-Pilot</h1>
  <p>Asisten perjalanan pintar kamu</p>

  <label>Lokasi awal</label>
  <input id="origin"
    placeholder="Contoh: Hotel Mulia Senayan">

  <label>Tujuan</label>
  <input id="destination"
    placeholder="Contoh: Ciputat Timur">

  <label>Kendaraan</label>
  <select id="vehicle">
    <option value="motor">Sepeda motor</option>
    <option value="car">Mobil</option>
  </select>

  <label>Prioritas perjalanan</label>
  <select id="priority">
    <option value="fast">Tercepat, hindari gang sempit</option>
    <option value="balanced">Seimbang dan nyaman</option>
    <option value="safe">Utamakan jalan utama</option>
  </select>

  <button onclick="openWaze()">
    BUKA NAVIGASI WAZE
  </button>

  <div class="note">
    <b>Preferensi Co-Pilot:</b><br>
    ✓ Mengutamakan jalan utama<br>
    ✓ Menghindari gang sempit<br>
    ✓ Menghindari jalan buntu<br>
    ✓ Mempertimbangkan jenis kendaraan
    <p id="status">
      Waze Co-Pilot siap digunakan.
    </p>
  </div>
</div>

<script>
function openWaze() {
  const destination =
    document.getElementById("destination").value.trim();

  const origin =
    document.getElementById("origin").value.trim();

  if (!destination) {
    alert("Masukkan tujuan perjalanan terlebih dahulu.");
    return;
  }

  const url = "https://waze.com/ul?q=" +
    encodeURIComponent(destination) +
    "&navigate=yes";

  document.getElementById("status").textContent =
    "Membuka Waze. Pastikan titik tujuan benar.";

  window.location.href = url;
}
</script>
</body>
</html>
